<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luftfracht Rechner</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>
<body>
  <div id="app">
    <!-- Phase 1: Paste & Parse -->
    <div id="phase-input" class="phase">
      <header class="app-header">
        <span class="app-icon">&#9992;</span>
        <h1>Luftfracht Rechner</h1>
      </header>

      <div class="card">
        <label for="email-text" class="field-label">E-Mail-Text einfügen</label>
        <textarea
          id="email-text"
          rows="12"
        ></textarea>
        <p class="hint">Dimensionen im Format: 1x 120*80*100 oder 120 x 80 x 100 / 50 kg</p>

        <div class="button-row">
          <button id="btn-parse" class="btn btn-primary">Einlesen</button>
          <button id="btn-clear" class="btn btn-secondary">Leeren</button>
        </div>
      </div>
    </div>

    <!-- Phase 2: Results table + edit -->
    <div id="phase-results" class="phase hidden">
      <header class="app-header">
        <span class="app-icon">&#9992;</span>
        <h1>Luftfracht Rechner</h1>
      </header>

      <div class="card table-card">
        <div class="table-wrapper">
          <table id="items-table">
            <thead>
              <tr>
                <th class="col-num">#</th>
                <th class="col-qty">Anz.</th>
                <th class="col-dim">L (cm)</th>
                <th class="col-dim">B (cm)</th>
                <th class="col-dim">H (cm)</th>
                <th class="col-weight">Gew. (kg)</th>
                <th class="col-del"></th>
              </tr>
            </thead>
            <tbody id="items-tbody">
              <!-- rows injected by JS -->
            </tbody>
          </table>
        </div>

        <button id="btn-add-row" class="btn btn-add">&#xFF0B; Packstück hinzufügen</button>
      </div>

      <div class="card results-card">
        <h2 class="results-title">Ergebnis</h2>
        <div class="result-row">
          <span class="result-label">Packstücke gesamt:</span>
          <span id="res-pieces" class="result-value">–</span>
        </div>
        <div class="result-row">
          <span class="result-label">Gesamtgewicht:</span>
          <span id="res-weight" class="result-value">–</span>
        </div>
        <div id="weight-warning" class="warning hidden">
          <span id="warning-text"></span>
        </div>
        <div class="result-row">
          <span class="result-label">Gesamtvolumen:</span>
          <span id="res-volume" class="result-value">–</span>
        </div>
        <div class="result-row">
          <span class="result-label">Volumengewicht (÷6000):</span>
          <span id="res-vol-weight" class="result-value">–</span>
        </div>
        <div class="result-row chargeable-row">
          <span class="result-label chargeable-label">Chargeable Weight:</span>
          <span id="res-chargeable" class="result-value chargeable-value">–</span>
        </div>
      </div>

      <div class="card action-card">
        <div class="button-row">
          <button id="btn-copy" class="btn btn-primary">Tabelle kopieren</button>
          <button id="btn-restart" class="btn btn-secondary">Neu starten</button>
        </div>
        <div id="copy-feedback" class="copy-feedback hidden">Kopiert &#10003;</div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
